<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código da Unha — Protocolo Natural Completo</title>
<style>
  :root {
    --verde: #1a7a5e;
    --verde-escuro: #0f5240;
    --verde-medio: #2eaa84;
    --verde-claro: #e8f5f0;
    --texto: #1a1a1a;
    --texto-suave: #4a4a4a;
    --borda: #d0e8df;
    --fundo: #f7faf9;
    --branco: #ffffff;
    --amarelo: #f5a623;
    --amarelo-claro: #fef9ee;
    --risco: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: var(--branco);
    color: var(--texto);
    line-height: 1.6;
  }

  /* LANG BAR */
  .lang-bar {
    background: var(--verde-escuro);
    padding: 8px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .lang-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.4);
    color: white;
    padding: 3px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-family: sans-serif;
  }
  .lang-btn.ativo { background: rgba(255,255,255,0.2); border-color: white; }

  /* TOPO */
  .topo-alerta {
    background: #1a1a1a;
    color: white;
    text-align: center;
    padding: 10px 16px;
    font-family: sans-serif;
    font-size: 13px;
  }
  .topo-alerta span { color: var(--amarelo); }

  /* HERO */
  .hero {
    background: linear-gradient(160deg, #0f3d2e 0%, #1a7a5e 100%);
    color: white;
    padding: 64px 24px 72px;
    text-align: center;
  }
  .hero-eyebrow {
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    line-height: 1.2;
    max-width: 760px;
    margin: 0 auto 20px;
    font-weight: normal;
  }
  .hero h1 em {
    font-style: normal;
    color: #7de8c2;
  }
  .hero-sub {
    font-family: sans-serif;
    font-size: 18px;
    opacity: 0.88;
    max-width: 560px;
    margin: 0 auto 36px;
    line-height: 1.6;
  }
  .hero-prova {
    font-family: sans-serif;
    font-size: 13px;
    opacity: 0.65;
    margin-top: 20px;
  }

  .btn-cta {
    display: inline-block;
    background: var(--amarelo);
    color: #1a1a1a;
    padding: 18px 40px;
    border-radius: 12px;
    font-size: 18px;
    font-family: sans-serif;
    font-weight: bold;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(245,166,35,0.4);
  }
  .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(245,166,35,0.5); }

  /* SEÇÕES */
  section { padding: 64px 24px; }
  .container { max-width: 740px; margin: 0 auto; }
  .container-lg { max-width: 960px; margin: 0 auto; }

  .sec-titulo {
    font-size: clamp(22px, 3.5vw, 34px);
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .sec-sub {
    font-family: sans-serif;
    font-size: 17px;
    color: var(--texto-suave);
    line-height: 1.7;
    margin-bottom: 32px;
  }

  /* DOR */
  .sec-dor { background: #1a1a1a; color: white; }
  .dor-lista { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .dor-lista li {
    font-family: sans-serif;
    font-size: 16px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.06);
    border-left: 3px solid #7de8c2;
    border-radius: 0 8px 8px 0;
    line-height: 1.5;
  }
  .dor-lista li strong { color: #7de8c2; }

  /* PROBLEMAS */
  .sec-problemas { background: var(--fundo); }
  .grid-problemas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 32px;
  }
  .card-problema {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
  }
  .card-problema .icone { font-size: 28px; margin-bottom: 10px; }
  .card-problema h3 {
    font-size: 16px;
    margin-bottom: 6px;
    color: var(--verde-escuro);
  }
  .card-problema p {
    font-family: sans-serif;
    font-size: 13px;
    color: var(--texto-suave);
    line-height: 1.5;
  }

  /* PRODUTO */
  .sec-produto { background: var(--branco); }
  .produto-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
  }
  @media (max-width: 640px) { .produto-wrap { grid-template-columns: 1fr; } }
  .mockup-livro {
    background: linear-gradient(135deg, var(--verde-escuro), var(--verde-medio));
    border-radius: 16px;
    padding: 40px 32px;
    color: white;
    text-align: center;
    aspect-ratio: 3/4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .mockup-livro .titulo-livro { font-size: 28px; line-height: 1.2; }
  .mockup-livro .sub-livro { font-family: sans-serif; font-size: 13px; opacity: 0.75; }
  .mockup-livro .divider { width: 40px; height: 2px; background: rgba(255,255,255,0.4); }
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .checklist li {
    font-family: sans-serif;
    font-size: 15px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    line-height: 1.5;
  }
  .check-ico { color: var(--verde-medio); font-size: 18px; flex-shrink: 0; margin-top: 1px; }

  /* BONUS */
  .sec-bonus { background: var(--amarelo-claro); border-top: 1px solid #fde8b0; border-bottom: 1px solid #fde8b0; }
  .bonus-titulo-sec {
    font-size: clamp(20px, 3vw, 30px);
    margin-bottom: 8px;
    text-align: center;
  }
  .bonus-sub-sec {
    font-family: sans-serif;
    font-size: 15px;
    color: var(--texto-suave);
    text-align: center;
    margin-bottom: 32px;
  }
  .grid-bonus {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .card-bonus {
    background: var(--branco);
    border: 1px solid #fde8b0;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bonus-valor {
    font-family: sans-serif;
    font-size: 11px;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .bonus-valor span { color: var(--risco); font-weight: bold; }
  .bonus-nome { font-size: 15px; color: var(--verde-escuro); }
  .bonus-desc { font-family: sans-serif; font-size: 13px; color: var(--texto-suave); line-height: 1.5; }

  /* DEPOIMENTOS */
  .sec-dep { background: var(--fundo); }
  .grid-dep {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 32px;
  }
  .card-dep {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 24px;
  }
  .dep-estrelas { color: var(--amarelo); font-size: 14px; margin-bottom: 10px; }
  .dep-texto {
    font-size: 15px;
    line-height: 1.65;
    margin-bottom: 16px;
    color: var(--texto-suave);
    font-style: italic;
  }
  .dep-nome { font-family: sans-serif; font-size: 13px; font-weight: bold; color: var(--texto); }
  .dep-local { font-family: sans-serif; font-size: 12px; color: var(--texto-suave); }

  /* PREÇO */
  .sec-preco { background: var(--verde-escuro); color: white; text-align: center; }
  .preco-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 540px;
    margin: 0 auto;
  }
  .preco-de {
    font-family: sans-serif;
    font-size: 14px;
    opacity: 0.6;
    text-decoration: line-through;
    margin-bottom: 4px;
  }
  .preco-por {
    font-size: 64px;
    font-weight: normal;
    color: #7de8c2;
    line-height: 1;
    margin-bottom: 8px;
  }
  .preco-label {
    font-family: sans-serif;
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 32px;
  }
  .preco-inclui {
    list-style: none;
    text-align: left;
    margin-bottom: 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .preco-inclui li {
    font-family: sans-serif;
    font-size: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    opacity: 0.9;
  }
  .garantia {
    margin-top: 20px;
    font-family: sans-serif;
    font-size: 13px;
    opacity: 0.65;
  }
  .garantia strong { opacity: 1; color: #7de8c2; }

  /* FAQ */
  .sec-faq { background: var(--fundo); }
  .faq-lista { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .faq-item {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 10px;
    overflow: hidden;
  }
  .faq-pergunta {
    width: 100%;
    text-align: left;
    padding: 18px 20px;
    font-size: 16px;
    font-family: 'Georgia', serif;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--texto);
  }
  .faq-seta { font-size: 18px; color: var(--verde); transition: transform 0.2s; }
  .faq-resposta {
    display: none;
    padding: 0 20px 18px;
    font-family: sans-serif;
    font-size: 15px;
    color: var(--texto-suave);
    line-height: 1.7;
  }
  .faq-item.aberto .faq-resposta { display: block; }
  .faq-item.aberto .faq-seta { transform: rotate(45deg); }

  /* RODAPÉ */
  footer {
    background: #111;
    color: rgba(255,255,255,0.5);
    text-align: center;
    padding: 32px 24px;
    font-family: sans-serif;
    font-size: 12px;
    line-height: 1.8;
  }

  /* STICKY CTA MOBILE */
  .sticky-cta {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: #1a1a1a;
    z-index: 100;
  }
  .sticky-cta button {
    width: 100%;
    background: var(--amarelo);
    color: #1a1a1a;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-family: sans-serif;
    font-weight: bold;
    cursor: pointer;
  }
  @media (max-width: 640px) { .sticky-cta { display: block; } }
</style>
</head>

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('ativo'));
  document.querySelector(`.lang-btn:${l === 'pt' ? 'first-child' : 'last-child'}`).classList.add('ativo');
  document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'es';
  render();
}
