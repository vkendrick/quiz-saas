<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Diagnóstico da Sua Unha</title>
<style>
  :root {
    --verde: #1a7a5e;
    --verde-claro: #e8f5f0;
    --verde-medio: #2eaa84;
    --texto: #1a1a1a;
    --texto-suave: #555;
    --borda: #d0e8df;
    --fundo: #f7faf9;
    --branco: #ffffff;
    --alerta: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: var(--fundo);
    color: var(--texto);
    min-height: 100vh;
  }
  .lang-bar {
    background: var(--verde);
    padding: 10px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .lang-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.5);
    color: white;
    padding: 4px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.2s;
  }
  .lang-btn.ativo { background: rgba(255,255,255,0.25); border-color: white; }
  .lang-btn:hover { background: rgba(255,255,255,0.2); }

  .hero {
    background: var(--verde);
    color: white;
    text-align: center;
    padding: 48px 24px 56px;
  }
  .hero-tag {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.75;
    font-family: sans-serif;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: clamp(24px, 5vw, 40px);
    font-weight: normal;
    line-height: 1.25;
    max-width: 680px;
    margin: 0 auto 16px;
  }
  .hero p {
    font-family: sans-serif;
    font-size: 16px;
    opacity: 0.85;
    max-width: 520px;
    margin: 0 auto;
  }

  .quiz-wrap {
    max-width: 680px;
    margin: -28px auto 0;
    padding: 0 16px 60px;
  }
  .card {
    background: var(--branco);
    border-radius: 16px;
    padding: 32px;
    border: 1px solid var(--borda);
  }

  .progresso-wrap {
    margin-bottom: 24px;
  }
  .progresso-label {
    font-family: sans-serif;
    font-size: 13px;
    color: var(--texto-suave);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .progresso-barra {
    height: 5px;
    background: var(--verde-claro);
    border-radius: 4px;
    overflow: hidden;
  }
  .progresso-fill {
    height: 100%;
    background: var(--verde-medio);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .pergunta {
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 24px;
    color: var(--texto);
  }
  .subtexto {
    font-family: sans-serif;
    font-size: 14px;
    color: var(--texto-suave);
    margin-top: -16px;
    margin-bottom: 22px;
  }

  .opcoes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opcao {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 1.5px solid var(--borda);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-family: sans-serif;
    font-size: 15px;
    color: var(--texto);
    background: var(--branco);
    text-align: left;
  }
  .opcao:hover { border-color: var(--verde-medio); background: var(--verde-claro); }
  .opcao.selecionada { border-color: var(--verde); background: var(--verde-claro); }
  .opcao-letra {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--verde-claro);
    color: var(--verde);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  .opcao.selecionada .opcao-letra {
    background: var(--verde);
    color: white;
  }

  .btn-avancar {
    margin-top: 28px;
    width: 100%;
    padding: 16px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-family: sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  .btn-avancar:hover { background: #155f4a; }
  .btn-avancar.visivel { display: block; }

  .erro {
    color: var(--alerta);
    font-family: sans-serif;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .erro.visivel { display: block; }

  /* RESULTADO */
  .resultado { display: none; }
  .resultado.visivel { display: block; }
  .resultado-icone {
    font-size: 48px;
    text-align: center;
    margin-bottom: 16px;
  }
  .resultado-badge {
    display: inline-block;
    background: var(--verde-claro);
    color: var(--verde);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 5px 16px;
    font-family: sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .resultado-titulo {
    font-size: 26px;
    line-height: 1.3;
    margin-bottom: 12px;
    color: var(--verde);
  }
  .resultado-desc {
    font-family: sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--texto-suave);
    margin-bottom: 24px;
  }
  .resultado-alertas {
    background: var(--verde-claro);
    border-left: 3px solid var(--verde-medio);
    border-radius: 0 8px 8px 0;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .resultado-alertas p {
    font-family: sans-serif;
    font-size: 14px;
    color: var(--verde);
    line-height: 1.7;
  }
  .cta-principal {
    display: block;
    width: 100%;
    padding: 18px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-family: sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
    margin-bottom: 12px;
  }
  .cta-principal:hover { background: #155f4a; }
  .cta-sec {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--verde);
    border: 1.5px solid var(--borda);
    border-radius: 12px;
    font-size: 15px;
    font-family: sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
  }
  .cta-sec:hover { background: var(--verde-claro); }

  .recomecar {
    text-align: center;
    margin-top: 20px;
    font-family: sans-serif;
    font-size: 13px;
    color: var(--texto-suave);
  }
  .recomecar a { color: var(--verde); cursor: pointer; text-decoration: underline; }

  .quiz-ativo { display: block; }
  .quiz-oculto { display: none; }
</style>
</head>
<body>

<div class="lang-bar">
  <button class="lang-btn ativo" onclick="setLang('pt')">🇧🇷 PT</button>
  <button class="lang-btn" onclick="setLang('es')">🇲🇽 ES</button>
</div>

<div class="hero">
  <div class="hero-tag" id="hero-tag">Diagnóstico gratuito</div>
  <h1 id="hero-titulo">O que está acontecendo com a sua unha?</h1>
  <p id="hero-sub">Responda 5 perguntas e descubra o problema exato — e o protocolo certo para resolver.</p>
</div>

<div class="quiz-wrap">
  <div class="card">

    <!-- QUIZ -->
    <div id="quiz-bloco" class="quiz-ativo">
      <div class="progresso-wrap">
        <div class="progresso-label">
          <span id="prog-texto">Pergunta 1 de 5</span>

        </div>
        <div class="progresso-barra">

        </div>
      </div>

      <p class="pergunta" id="pergunta-texto"></p>
      <p class="subtexto" id="subtexto-texto"></p>
      <div class="opcoes" id="opcoes-container"></div>
      <div class="erro" id="msg-erro"></div>
      <button class="btn-avancar" id="btn-avancar" onclick="avancar()"></button>
    </div>

    <!-- RESULTADO -->
    <div id="resultado-bloco" class="resultado">
      <div class="resultado-icone" id="res-icone"></div>
      <div style="text-align:center">
        <span class="resultado-badge" id="res-badge"></span>
      </div>
      <h2 class="resultado-titulo" id="res-titulo"></h2>
      <p class="resultado-desc" id="res-desc"></p>
      <div class="resultado-alertas">
        <p id="res-alertas"></p>
      </div>
      <button class="cta-principal" id="res-cta1"></button>
      <button class="cta-sec" id="res-cta2"></button>
      <div class="recomecar">
        <a onclick="reiniciar()" id="res-recomecar"></a>
      </div>
    </div>

  </div>
</div>

let lang = 'pt';
let perguntaAtual = 0;
let respostasSelecionadas = [];
let opcaoSelecionada = null;

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('ativo'));
  document.querySelector(`.lang-btn:${l === 'pt' ? 'first-child' : 'last-child'}`).classList.add('ativo');
  reiniciar();
}

function renderPergunta() {
  const c = conteudo[lang];
  const p = c.perguntas[perguntaAtual];
  const total = c.perguntas.length;
  const pct = Math.round((perguntaAtual / total) * 100);

  document.getElementById('hero-tag').textContent = c.heroTag;
  document.getElementById('hero-titulo').textContent = c.heroTitulo;
  document.getElementById('hero-sub').textContent = c.heroSub;
  document.getElementById('prog-texto').textContent = c.progTexto(perguntaAtual + 1, total);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('pergunta-texto').textContent = p.texto;
  document.getElementById('subtexto-texto').textContent = p.subtexto;

  const isUltima = perguntaAtual === total - 1;
  const btn = document.getElementById('btn-avancar');
  btn.textContent = isUltima ? c.btnFinalizar : c.btnAvancar;
  btn.classList.remove('visivel');
  document.getElementById('msg-erro').classList.remove('visivel');

  const container = document.getElementById('opcoes-container');
  container.innerHTML = '';
  opcaoSelecionada = null;

  p.opcoes.forEach((op, i) => {
    const div = document.createElement('button');
    div.className = 'opcao';
    div.innerHTML = `<span class="opcao-letra">${op.letra}</span><span>${op.texto}</span>`;
    div.onclick = () => selecionarOpcao(i, div, op.pontos);
    container.appendChild(div);
  });
}

function selecionarOpcao(idx, el, pontos) {
  document.querySelectorAll('.opcao').forEach(o => o.classList.remove('selecionada'));
  el.classList.add('selecionada');
  opcaoSelecionada = { idx, pontos };
  document.getElementById('btn-avancar').classList.add('visivel');
  document.getElementById('msg-erro').classList.remove('visivel');
}

function avancar() {
  const c = conteudo[lang];
  if (!opcaoSelecionada) {
    const err = document.getElementById('msg-erro');
    err.textContent = c.msgErro;
    err.classList.add('visivel');
    return;
  }
  respostasSelecionadas.push(opcaoSelecionada.pontos);
  perguntaAtual++;
  if (perguntaAtual >= c.perguntas.length) {
    mostrarResultado();
  } else {
    renderPergunta();
  }
}

function calcularDiagnostico() {
  const totais = { fungo: 0, encravada: 0, trauma: 0, fragilidade: 0 };
  respostasSelecionadas.forEach(r => {
    Object.entries(r).forEach(([k, v]) => { totais[k] = (totais[k] || 0) + v; });
  });
  return Object.entries(totais).sort((a, b) => b[1] - a[1])[0][0];
}

function mostrarResultado() {
  const c = conteudo[lang];
  const diag = calcularDiagnostico();
  const res = c.resultados[diag];

  document.getElementById('res-icone').textContent = res.icone;
  document.getElementById('res-badge').textContent = res.badge;
  document.getElementById('res-titulo').textContent = res.titulo;
  document.getElementById('res-desc').textContent = res.desc;
  document.getElementById('res-alertas').textContent = res.alertas;
  document.getElementById('res-cta1').textContent = res.cta1;
  document.getElementById('res-cta2').textContent = res.cta2;
  document.getElementById('res-recomecar').textContent = c.recomecar;

  document.getElementById('quiz-bloco').classList.add('quiz-oculto');
  document.getElementById('resultado-bloco').classList.add('visivel');

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
}

function reiniciar() {
  perguntaAtual = 0;
  respostasSelecionadas = [];
  opcaoSelecionada = null;
  document.getElementById('quiz-bloco').classList.remove('quiz-oculto');
  document.getElementById('resultado-bloco').classList.remove('visivel');
  renderPergunta();
}

reiniciar();
</script>
